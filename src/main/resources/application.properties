spring.application.name=MediCare
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/medisuggest?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
spring.jackson.serialization.write-dates-as-timestamps=false
app.admin.email=${ADMIN_EMAIL:admin@medisuggest.local}
app.admin.password=${ADMIN_PASSWORD:Admin123!}
